name: CI/CD Pipeline - Build & Deploy to Proxmox

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'api/**'
      - 'db/**'
      - 'docker-compose.yml'
      - 'Dockerfile'
      - '.github/workflows/ci-cd.yml'
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PROXMOX_IP: 192.168.1.200
  PROXMOX_USER: root
  PROXMOX_REALM: pam
  DEPLOYMENT_USER: arada
  DEPLOYMENT_HOST: 10.10.10.100
  DOMAIN: arada.fun

jobs:
  # ============================================================================
  # STAGE 1: TEST & LINT
  # ============================================================================
  test:
    runs-on: ubuntu-latest
    name: Test & Lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install pytest pytest-cov bandit flake8

      - name: Run linting (flake8)
        run: |
          flake8 api/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 api/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run security checks (bandit)
        run: |
          bandit -r api/ -ll --format json -o bandit-report.json || true
          bandit -r api/ -ll

      - name: Run unit tests
        run: |
          pytest api/tests/ -v --cov=api --cov-report=xml --cov-report=html
        continue-on-error: true

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  # ============================================================================
  # STAGE 2: BUILD DOCKER IMAGE
  # ============================================================================
  build:
    needs: test
    runs-on: ubuntu-latest
    name: Build Docker Image
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  # ============================================================================
  # STAGE 3: DEPLOY TO PROXMOX (MAIN BRANCH ONLY)
  # ============================================================================
  deploy:
    needs: build
    runs-on: ubuntu-latest
    name: Deploy to Proxmox
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://api.${{ env.DOMAIN }}/system/health

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROXMOX_SSH_KEY }}" > ~/.ssh/proxmox_key
          chmod 600 ~/.ssh/proxmox_key
          ssh-keyscan -H ${{ env.PROXMOX_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Verify Proxmox connectivity
        run: |
          ssh -i ~/.ssh/proxmox_key ${{ env.PROXMOX_USER }}@${{ env.PROXMOX_IP }} "echo 'Connected to Proxmox'"

      - name: Pull latest Docker image
        run: |
          ssh -i ~/.ssh/proxmox_key ${{ env.PROXMOX_USER }}@${{ env.DEPLOYMENT_HOST }} \
            "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

      - name: Stop running containers
        run: |
          ssh -i ~/.ssh/proxmox_key ${{ env.PROXMOX_USER }}@${{ env.DEPLOYMENT_HOST }} \
            "cd /opt/arada && docker-compose -f docker-compose.prod.yml down" || true

      - name: Run database migrations
        run: |
          ssh -i ~/.ssh/proxmox_key ${{ env.PROXMOX_USER }}@${{ env.DEPLOYMENT_HOST }} \
            "cd /opt/arada && docker-compose -f docker-compose.prod.yml run --rm api python -m alembic upgrade head"

      - name: Start containers
        run: |
          ssh -i ~/.ssh/proxmox_key ${{ env.PROXMOX_USER }}@${{ env.DEPLOYMENT_HOST }} \
            "cd /opt/arada && docker-compose -f docker-compose.prod.yml up -d"

      - name: Wait for API to be healthy
        run: |
          for i in {1..30}; do
            if curl -f https://api.${{ env.DOMAIN }}/system/health > /dev/null 2>&1; then
              echo "API is healthy!"
              exit 0
            fi
            echo "Attempt $i: API not ready, waiting..."
            sleep 10
          done
          echo "API failed to become healthy!"
          exit 1

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/proxmox_key ${{ env.PROXMOX_USER }}@${{ env.DEPLOYMENT_HOST }} \
            "docker-compose -f /opt/arada/docker-compose.prod.yml ps"

      - name: Post deployment notifications
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "API: https://api.${{ env.DOMAIN }}"
          echo "Metrics: https://metrics.${{ env.DOMAIN }}"
          echo "Deployed at: $(date)"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "❌ Deployment failed! Rolling back..."
          ssh -i ~/.ssh/proxmox_key ${{ env.PROXMOX_USER }}@${{ env.DEPLOYMENT_HOST }} \
            "cd /opt/arada && docker-compose -f docker-compose.prod.yml pull && docker-compose -f docker-compose.prod.yml up -d" || true
          echo "Rollback attempted"

      - name: Clean up SSH key
        if: always()
        run: |
          rm -f ~/.ssh/proxmox_key

  # ============================================================================
  # STAGE 4: NOTIFY SLACK (OPTIONAL)
  # ============================================================================
  notify:
    runs-on: ubuntu-latest
    needs: [ test, build, deploy ]
    if: always()
    name: Notify Status

    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "Arada Deployment Status",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🚀 Arada Deployment Report"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Branch:*\n${{ github.ref }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n${{ github.sha }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Author:*\n${{ github.actor }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Status:*\n${{ needs.deploy.result || 'Skipped' }}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "View: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|GitHub Actions>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: secrets.SLACK_WEBHOOK_URL != ''
