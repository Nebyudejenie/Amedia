# Arada Intelligence OS — Redis tuning for queue workloads.
# Shared VM-100 with Postgres/Qdrant/Ollama/MinIO/n8n/API; conservative sizes.

# Server
port 6379
bind 127.0.0.1
timeout 0
tcp-backlog 511
tcp-keepalive 300

# Memory (shared 20GB core; Redis = ~2GB)
maxmemory 2gb
maxmemory-policy allkeys-lru
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes

# Persistence (RDB for snapshots)
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb

# Streams + consumer groups
stream-node-max-bytes 4096
stream-node-max-entries 100

# Replication
repl-diskless-sync no
repl-diskless-sync-delay 5

# Logging
loglevel notice
logfile ""
databases 16

# Lazy free (7.0+ only)
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
