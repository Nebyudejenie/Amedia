# Arada Intelligence OS — PostgreSQL tuning (included into postgresql.conf).
# Sized for VM-100 where Postgres SHARES ~20GB RAM with Redis, Qdrant, Ollama,
# MinIO, n8n and the API. Values are deliberately modest to avoid starving the
# co-located AI/runtime services. Scale up if you move Postgres to its own VM.

# --- Memory ---------------------------------------------------------------
shared_buffers = 512MB              # ~conservative; raise toward 25% of RAM if Postgres gets its own box
effective_cache_size = 2GB         # planner hint: OS cache available to PG
work_mem = 16MB                    # per sort/hash node; keep low (many small queries)
maintenance_work_mem = 256MB       # index builds, VACUUM
huge_pages = try

# --- Connections ----------------------------------------------------------
max_connections = 100              # workers use small pools; add PgBouncer (P2) before raising

# --- Write-ahead log / checkpoints ---------------------------------------
wal_compression = on
min_wal_size = 256MB
max_wal_size = 2GB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min

# --- Planner (SSD) --------------------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200

# --- Parallelism (small box) ---------------------------------------------
max_worker_processes = 8
max_parallel_workers = 4
max_parallel_workers_per_gather = 2

# --- Autovacuum (write-heavy events/analytics) ---------------------------
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s

# --- Observability --------------------------------------------------------
log_min_duration_statement = 1000  # log queries slower than 1s
log_checkpoints = on
log_lock_waits = on
log_line_prefix = '%m [%p] %u@%d '
track_io_timing = on
