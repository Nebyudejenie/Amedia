version: '3.8'

# Production Docker Compose for Proxmox Deployment
# Run: docker-compose -f docker-compose.prod.yml up -d

services:
  # ============================================================================
  # DATABASE TIER
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: arada-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-arada}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      POSTGRES_DB: ${DB_NAME:-arada}
      POSTGRES_INITDB_ARGS: |
        -c shared_buffers=1GB
        -c effective_cache_size=4GB
        -c work_mem=32MB
        -c wal_level=replica
        -c max_wal_senders=10
        -c hot_standby=on
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
      - ./backups:/backups
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-arada}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arada-internal
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

  # ============================================================================
  # CACHE TIER
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: arada-redis-prod
    restart: always
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./data/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arada-internal
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

  # ============================================================================
  # OBJECT STORAGE
  # ============================================================================
  minio:
    image: minio/minio:latest
    container_name: arada-minio-prod
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-arada}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY required}
      MINIO_BROWSER: "on"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arada-internal
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

  # ============================================================================
  # VECTOR DB
  # ============================================================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: arada-qdrant-prod
    restart: always
    environment:
      QDRANT_ALLOW_RECOVERY_MODE: "false"
      QDRANT_API_KEY: ${QDRANT_API_KEY:-qdrant}
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arada-internal
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

  # ============================================================================
  # LLM SERVICE
  # ============================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: arada-ollama-prod
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - arada-internal
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

  # ============================================================================
  # API SERVER
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: ${REGISTRY}/arada-os:latest
    container_name: arada-api-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      # App Config
      DEBUG: "false"
      APP_ENV: production
      LOG_LEVEL: info

      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-arada}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      DB_NAME: ${DB_NAME:-arada}
      DB_POOL_MIN: 10
      DB_POOL_MAX: 50

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0

      # MinIO
      MINIO_HOST: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-arada}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY required}
      MINIO_BUCKET_PREFIX: arada
      MINIO_SECURE: "false"

      # Qdrant
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-qdrant}

      # Ollama
      OLLAMA_HOST: http://ollama:11434
      LLM_PROVIDER: ollama

      # Security
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY required}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 15
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: 7

      # Rate Limiting
      RATE_LIMIT_CALLS: 100
      RATE_LIMIT_PERIOD_SECONDS: 60

      # CORS
      CORS_ORIGINS: '["https://arada.fun", "https://api.arada.fun"]'

    volumes:
      - ./api:/app
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/system/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - arada-internal
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

  # ============================================================================
  # BACKGROUND WORKERS
  # ============================================================================
  rss-worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: ${REGISTRY}/arada-os:latest
    container_name: arada-rss-worker-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DEBUG: "false"
      APP_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-arada}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      DB_NAME: ${DB_NAME:-arada}
      RSS_FETCH_INTERVAL_MINUTES: ${RSS_FETCH_INTERVAL_MINUTES:-15}
      RSS_FETCH_TIMEOUT_SECONDS: ${RSS_FETCH_TIMEOUT_SECONDS:-30}
      RSS_BATCH_SIZE: ${RSS_BATCH_SIZE:-20}
      RSS_ERROR_THRESHOLD: ${RSS_ERROR_THRESHOLD:-5}
    command: python workers/rss_worker.py
    networks:
      - arada-internal
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

  worker-content:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: ${REGISTRY}/arada-os:latest
    container_name: arada-worker-content-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DEBUG: "false"
      APP_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-arada}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      DB_NAME: ${DB_NAME:-arada}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
    command: python worker.py
    networks:
      - arada-internal
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: ${REGISTRY}/arada-os:latest
    container_name: arada-orchestrator-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DEBUG: "false"
      APP_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-arada}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      DB_NAME: ${DB_NAME:-arada}
    command: python orchestrator.py
    networks:
      - arada-internal
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

  publisher:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: ${REGISTRY}/arada-os:latest
    container_name: arada-publisher-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DEBUG: "false"
      APP_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-arada}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      DB_NAME: ${DB_NAME:-arada}
    command: python publisher.py
    networks:
      - arada-internal
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

  # ============================================================================
  # MONITORING & ANALYTICS
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: arada-prometheus-prod
    restart: always
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - arada-internal
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

  grafana:
    image: grafana/grafana:latest
    container_name: arada-grafana-prod
    restart: always
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD required}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/monitoring/grafana-provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    networks:
      - arada-internal
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

  metabase:
    image: metabase/metabase:latest
    container_name: arada-metabase-prod
    restart: always
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_HOST: postgres
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASSWORD:?METABASE_DB_PASSWORD required}
      MB_ENCRYPTION_SECRET_KEY: ${METABASE_SECRET_KEY:?METABASE_SECRET_KEY required}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - arada-internal
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

# ============================================================================
# VOLUMES
# ============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  qdrant_data:
    driver: local
  ollama_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# ============================================================================
# NETWORKS
# ============================================================================
networks:
  arada-internal:
    driver: bridge
    ipam:
      config:
        # NOTE: must NOT overlap Proxmox vmbr1 (10.10.10.0/24) — caused
        # host→container port-forwarding to fail. Use an isolated subnet.
        - subnet: 172.30.0.0/24
