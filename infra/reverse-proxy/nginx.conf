# Arada Intelligence OS — Nginx Reverse Proxy Configuration
# File: /etc/nginx/sites-available/arada
# Setup: sudo ln -s /etc/nginx/sites-available/arada /etc/nginx/sites-enabled/

# Upstream API server
upstream api {
    server localhost:8000;
    keepalive 32;  # Connection pool
}

# Upstream Grafana (monitoring)
upstream grafana {
    server localhost:3000;
    keepalive 16;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;  # Stricter for auth

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name arada.fun www.arada.fun;

    # ACME validation for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS API server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name arada.fun www.arada.fun;

    # SSL/TLS certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/arada.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arada.fun/privkey.pem;

    # SSL/TLS configuration (Mozilla Modern)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # OCSP stapling (faster cert validation)
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_stapling_responder http://ocsp.int-x3.letsencrypt.org/;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;
    gzip_min_length 1000;
    gzip_disable "msie6";

    # Logging
    access_log /var/log/nginx/arada-access.log combined;
    error_log /var/log/nginx/arada-error.log warn;

    # Client limits
    client_max_body_size 100M;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # Buffering
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Default location (API)
    location / {
        # Rate limiting (100 req/s per IP)
        limit_req zone=api burst=200 nodelay;

        # Proxy settings
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Request-ID $request_id;

        # WebSocket support
        proxy_cache_bypass $http_upgrade;

        # Disable buffering for streaming
        proxy_buffering off;
    }

    # Authentication endpoints (stricter rate limit)
    location ~ ^/auth/(register|login|refresh)$ {
        limit_req zone=auth burst=5 nodelay;

        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check endpoint (no rate limit)
    location = /system/health {
        access_log off;  # Don't log health checks
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Metrics endpoint (internal only)
    location = /metrics {
        allow 10.0.0.0/8;      # Private networks
        allow 127.0.0.1;       # Localhost
        deny all;              # Deny public access

        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Static files (if any)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2)$ {
        proxy_pass http://api;
        proxy_cache_valid 200 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# Monitoring server (Grafana)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name monitoring.arada.fun;

    ssl_certificate /etc/letsencrypt/live/arada.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arada.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Basic auth for monitoring
    auth_basic "Monitoring";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://grafana;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
