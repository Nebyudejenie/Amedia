apiVersion: v1
kind: Secret
metadata:
  name: arada-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: arada-os
type: Opaque
stringData:
  db-password: {{ .Values.postgres.credentials.password | quote }}
  minio-secret-key: {{ .Values.minio.credentials.secretKey | quote }}
  jwt-secret-key: {{ .Values.global.jwtSecretKey | quote }}
  qdrant-api-key: {{ .Values.qdrant.apiKey | default "" | quote }}
