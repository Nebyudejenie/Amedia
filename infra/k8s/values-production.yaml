# Arada Intelligence OS — Kubernetes Production Values

global:
  namespace: arada
  domain: arada.fun
  environment: production
  jwtSecretKey: ""  # Set via --set or helm secrets

postgres:
  enabled: true
  replicas: 1
  storage:
    size: 500Gi
    class: fast-ssd
  resources:
    requests:
      memory: "1Gi"
      cpu: "1000m"
    limits:
      memory: "4Gi"
      cpu: "4000m"
  persistence:
    enabled: true
    storageClass: fast-ssd
    size: 500Gi

redis:
  enabled: true
  replicas: 1
  storage:
    size: 50Gi
    class: fast-ssd
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "2000m"

minio:
  enabled: true
  replicas: 1
  storage:
    size: 1Ti  # 1TB for production
    class: fast-ssd
  resources:
    requests:
      memory: "1Gi"
      cpu: "1000m"
    limits:
      memory: "2Gi"
      cpu: "2000m"

qdrant:
  enabled: true
  replicas: 1
  storage:
    size: 200Gi
    class: fast-ssd
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "2000m"

ollama:
  enabled: true
  replicas: 1
  resources:
    requests:
      memory: "8Gi"
      cpu: "4000m"
    limits:
      memory: "16Gi"
      cpu: "8000m"

api:
  enabled: true
  replicas: 5
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "2000m"
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

worker:
  content:
    enabled: true
    replicas: 3
    resources:
      requests:
        memory: "512Mi"
        cpu: "500m"
      limits:
        memory: "1Gi"
        cpu: "1000m"
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 10

  orchestrator:
    enabled: true
    replicas: 3
    resources:
      requests:
        memory: "512Mi"
        cpu: "500m"
      limits:
        memory: "1Gi"
        cpu: "1000m"
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 5

  publisher:
    enabled: true
    replicas: 3
    resources:
      requests:
        memory: "512Mi"
        cpu: "500m"
      limits:
        memory: "1Gi"
        cpu: "1000m"
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 10

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "1000"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: arada.fun
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: arada-tls-prod
      hosts:
        - arada.fun

monitoring:
  enabled: true
  prometheus:
    enabled: true
    scrapeInterval: 15s
    retentionDays: 30

logging:
  enabled: true
  level: info
  format: json

rbac:
  create: true

serviceAccount:
  create: true
  name: arada

networkPolicy:
  enabled: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1

backup:
  enabled: true
  schedule: "0 2 * * *"
  retention: 30
