version: "3.8"

# VM-100 (Core Services): PostgreSQL, Redis, FastAPI, worker-content
# Network: vmbr1 (10.10.10.0/24)
# This is for internal use only. External access goes through Cloudflare Tunnel.

services:
  postgres:
    image: postgres:16-alpine
    container_name: arada-postgres
    environment:
      POSTGRES_USER: arada
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: arada
      POSTGRES_INITDB_ARGS: "-c shared_buffers=512MB -c effective_cache_size=2GB -c work_mem=16MB"
    ports:
      - "10.10.10.100:5432:5432"  # Internal network only
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /var/arada/backup/wal:/var/lib/postgresql/wal_archive  # WAL archiving
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arada"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arada-internal
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: arada-redis
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "10.10.10.100:6379:6379"  # Internal network only
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arada-internal
    restart: unless-stopped

  api:
    image: arada-os:latest
    build:
      context: ../../api
      dockerfile: Dockerfile
    container_name: arada-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DEBUG: "false"
      CORS_ORIGINS: '["http://localhost:3000"]'
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: arada
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: arada
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      MINIO_HOST: 10.10.10.101  # VM-101
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: arada
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_PREFIX: arada
      QDRANT_HOST: 10.10.10.101  # VM-101
      QDRANT_PORT: 6333
      OLLAMA_HOST: 10.10.10.101  # VM-101
      OLLAMA_PORT: 11434
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 15
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: 7
    ports:
      - "10.10.10.100:8000:8000"  # Internal network only
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/system/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arada-internal
    restart: unless-stopped

  worker-content:
    image: arada-os:latest
    build:
      context: ../../api
      dockerfile: Dockerfile
    container_name: arada-worker-content
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: arada
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: arada
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      QDRANT_HOST: 10.10.10.101  # VM-101
      QDRANT_PORT: 6333
      OLLAMA_HOST: 10.10.10.101  # VM-101
      OLLAMA_PORT: 11434
    command: python worker.py
    networks:
      - arada-internal
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  arada-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.10.0/24
